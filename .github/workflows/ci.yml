name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"

      - name: Run Ruff Lint Check
        run: python -m ruff check .

      - name: Run Ruff Format Check
        run: python -m ruff format --check .

      - name: Run Mypy Type Check
        run: python -m mypy rrl/

      - name: Run tests
        # The retriever tests inject a MockSentenceTransformer, so the suite
        # runs network-free (no model weights are downloaded).
        run: python -m pytest tests/ -q

      - name: Run recurring gate self-test (smoke test)
        run: python3 sim/run_gate_recurring.py --selftest

      - name: Run full-outcome-table gate self-test (smoke test)
        run: python3 sim/run_gate_matrix.py --selftest

      - name: Run private-API gate self-test (smoke test)
        run: python3 sim/run_gate_g.py --selftest

      - name: Run tool-selection gate self-test (smoke test)
        run: python3 sim/run_gate_t.py --selftest

      - name: Run web-scraping gate self-test (smoke test)
        run: python3 sim/run_gate_w.py --selftest

      - name: Run live MCP gate self-test (starts local MCP servers)
        run: python3 sim/run_gate_m.py --selftest

      - name: Run MCPTox tool-selection gate self-test (smoke test)
        run: python3 sim/run_gate_x.py --selftest

      - name: Run MCPEvol-Bench tool-selection gate self-test (smoke test)
        run: python3 sim/run_gate_v.py --selftest
